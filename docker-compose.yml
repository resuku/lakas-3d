services:
  dev:
    image: node:22-slim
    volumes:
      - .:/workspace
      # A felújítási projekt adatai csak olvasásra (forrásellenőrzéshez)
      - "../Felujítás:/data:ro"
    ports:
      - "5173:5173"
    working_dir: /workspace
    user: node
    command: sleep infinity
    tty: true
    stdin_open: true
